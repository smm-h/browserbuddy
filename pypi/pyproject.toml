[project]
name = "browserbuddy"
version = "0.1.0"
description = "Name reservation for BrowserBuddy, the browser/AI shared-space MCP server. The actual server ships on npm: npx browserbuddy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/smm-h/browserbuddy"
Repository = "https://github.com/smm-h/browserbuddy"

[project.scripts]
browserbuddy = "browserbuddy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browserbuddy"]
